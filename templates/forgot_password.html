<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
}

.card{
    border-radius:15px;
}

</style>

</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card p-4 shadow-lg" style="width:380px">

    <h4 class="text-center mb-3">
        <i class="bi bi-key-fill text-warning"></i> Forgot Password
    </h4>

    <form method="POST" onsubmit="return validateForm()">

        <!-- USERNAME -->
        <div class="mb-3">
            <input type="text" name="username" 
                   class="form-control" placeholder="Username" required>
        </div>

        <!-- ROLE -->
        <div class="mb-3">
            <select name="role" class="form-select" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select>
        </div>

        <!-- NEW PASSWORD -->
        <div class="mb-3">
            <div class="input-group">
                <input type="password" name="new_password" id="pass1"
                       class="form-control" placeholder="New Password" required>
                <button type="button" class="btn btn-outline-secondary"
                        onclick="togglePass('pass1',this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <small id="strength" class="fw-semibold"></small>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3">
            <input type="password" id="pass2"
                   class="form-control" placeholder="Confirm Password" required>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-dark w-100">
            <i class="bi bi-arrow-repeat"></i> Reset Password
        </button>

    </form>

    {% if msg %}
    <div class="alert alert-info mt-3 text-center">
        {{msg}}
    </div>
    {% endif %}

    <a href="/login" class="d-block text-center mt-3 text-white">
        ⬅ Back to Login
    </a>

</div>

<!-- 🔥 SCRIPT -->
<script>

// 👁️ SHOW/HIDE PASSWORD
function togglePass(id, btn){
    let input = document.getElementById(id);
    let icon = btn.querySelector("i");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("bi-eye","bi-eye-slash");
    }else{
        input.type = "password";
        icon.classList.replace("bi-eye-slash","bi-eye");
    }
}

// 🔐 PASSWORD STRENGTH
document.getElementById("pass1").addEventListener("input", function(){
    let val = this.value;
    let text = document.getElementById("strength");

    if(val.length < 5){
        text.innerHTML = "Weak Password";
        text.style.color = "red";
    } 
    else if(val.length < 8){
        text.innerHTML = "Medium Password";
        text.style.color = "orange";
    } 
    else {
        text.innerHTML = "Strong Password";
        text.style.color = "green";
    }
});

// ✅ VALIDATION
function validateForm(){
    let p1 = document.getElementById("pass1").value;
    let p2 = document.getElementById("pass2").value;

    if(p1 !== p2){
        alert("Passwords do not match!");
        return false;
    }
    return true;
}

</script>

</body>
</html>
