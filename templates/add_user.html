{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <!-- 🔥 PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">
            <i class="bi bi-person-plus-fill text-primary"></i> Create New User
        </h3>
    </div>

    <!-- 🔥 CARD FORM -->
    <div class="card border-0 shadow-lg rounded-4">

        <!-- HEADER -->
        <div class="card-header bg-gradient bg-primary text-white rounded-top-4">
            <h5 class="mb-0">
                <i class="bi bi-person-badge"></i> User Details
            </h5>
        </div>

        <!-- BODY -->
        <div class="card-body p-4">

            <form method="POST">

                <!-- USERNAME -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-person"></i> Username
                    </label>
                    <input type="text" name="username"
                           class="form-control form-control-lg shadow-sm"
                           placeholder="Enter username"
                           required>
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <input type="password" name="password"
                           class="form-control form-control-lg shadow-sm"
                           placeholder="Enter password"
                           required>
                </div>

                <!-- ROLE -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-person-gear"></i> Role
                    </label>
                    <select name="role" class="form-select form-select-lg shadow-sm">
                        <option value="admin">👑 Admin</option>
                        <option value="user">👤 User</option>
                    </select>
                </div>

                <!-- BUTTONS -->
                <div class="d-flex justify-content-between">

                    <a href="/dashboard" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>

                    <button class="btn btn-success px-4 shadow">
                        <i class="bi bi-check-circle"></i> Create User
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
