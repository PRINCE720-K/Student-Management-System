{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<!-- 🔥 HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">
        <i class="bi bi-arrow-up-right-circle text-success"></i> Promotion History
    </h3>

    <span class="badge bg-dark">
        {{data|length}} Records
    </span>
</div>

<!-- 🔍 SEARCH -->
<div class="card p-3 shadow-sm border-0 mb-3">
    <input type="text" id="searchInput" class="form-control"
           placeholder="🔍 Search by name or roll...">
</div>

<!-- 📋 TABLE -->
<div class="card shadow-lg border-0 rounded-4 p-3">

{% if data %}

<div class="table-responsive">
<table class="table table-hover align-middle text-center" id="promoTable">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Roll</th>
<th>Name</th>
<th>From</th>
<th>➡</th>
<th>To</th>
<th>Date</th>
</tr>
</thead>

<tbody>

{% for h in data %}
<tr>

<td><b>{{h[0]}}</b></td>

<td>{{h[2]}}</td>

<td>{{h[3]}}</td>

<td>
    <span class="badge bg-secondary">
        {{h[4]}}
    </span>
</td>

<td>
    <i class="bi bi-arrow-right text-primary"></i>
</td>

<td>
    <span class="badge bg-success">
        {{h[5]}}
    </span>
</td>

<td>
    <span class="text-muted">
        {{h[6]}}
    </span>
</td>

</tr>
{% endfor %}

</tbody>

</table>
</div>

{% else %}

<!-- ❌ EMPTY -->
<div class="text-center py-5">
    <i class="bi bi-clock-history display-4 text-muted"></i>
    <h5 class="mt-3 text-danger">No Promotion History Found</h5>
</div>

{% endif %}

</div>

</div>

<!-- 🔥 SCRIPT -->
<script>

// 🔍 LIVE SEARCH
document.getElementById("searchInput").addEventListener("keyup", function(){
    let value = this.value.toLowerCase();
    let rows = document.querySelectorAll("#promoTable tbody tr");

    rows.forEach(row => {
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
    });
});

</script>

<!-- 🔥 STYLE -->
<style>

.card{
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
}

.table-hover tbody tr:hover{
    background:#f1f5ff;
}

</style>

{% endblock %}
