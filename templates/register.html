<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Setup Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 🔥 GLASS CARD */
.card{
    border-radius:15px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
}

/* INPUT */
.form-control{
    border-radius:10px;
}

/* BUTTON */
.btn-dark{
    border-radius:10px;
    transition:0.3s;
}
.btn-dark:hover{
    transform:scale(1.03);
}

small{
    font-size:13px;
}

</style>

</head>

<body>

<div class="card p-4 shadow-lg" style="width:370px">

    <h4 class="text-center mb-1">
        ⚙ First Time Setup
    </h4>

    <p class="text-center text-light mb-3">
        Create Admin Account
    </p>

    <form method="POST" onsubmit="return validateForm()">

        <!-- USERNAME -->
        <div class="mb-3">
            <input type="text" name="username"
                   class="form-control"
                   placeholder="Admin Username" required>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <div class="input-group">
                <input type="password" name="password"
                       id="password"
                       class="form-control"
                       placeholder="Password" required>

                <button type="button" class="btn btn-outline-light"
                        onclick="togglePassword('password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <small id="strengthText"></small>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3">
            <input type="password" id="confirmPassword"
                   class="form-control"
                   placeholder="Confirm Password" required>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-dark w-100" id="btn">
            Create Admin
        </button>

    </form>

</div>

<!-- 🔥 SCRIPT -->
<script>

// 👁️ SHOW PASSWORD
function togglePassword(id, btn){
    let input = document.getElementById(id);
    let icon = btn.querySelector("i");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("bi-eye","bi-eye-slash");
    }else{
        input.type = "password";
        icon.classList.replace("bi-eye-slash","bi-eye");
    }
}

// 🔐 PASSWORD STRENGTH
document.getElementById("password").addEventListener("input", function(){
    let val = this.value;
    let text = document.getElementById("strengthText");

    if(val.length < 5){
        text.innerHTML = "Weak Password";
        text.style.color = "red";
    } else if(val.length < 8){
        text.innerHTML = "Medium Password";
        text.style.color = "orange";
    } else {
        text.innerHTML = "Strong Password";
        text.style.color = "lightgreen";
    }
});

// ✅ VALIDATION
function validateForm(){
    let p = document.getElementById("password").value;
    let c = document.getElementById("confirmPassword").value;

    if(p !== c){
        alert("Passwords do not match!");
        return false;
    }

    // loading effect
    let btn = document.getElementById("btn");
    btn.innerHTML = "Creating...";
    btn.disabled = true;

    return true;
}

</script>

</body>
</html>
