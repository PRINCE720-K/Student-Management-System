{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <!-- 🔥 HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">
            <i class="bi bi-key-fill text-warning"></i> Change Password
        </h3>
    </div>

    <!-- 🔥 CARD -->
    <div class="card shadow-lg border-0 rounded-4">

        <!-- HEADER -->
        <div class="card-header bg-warning text-dark rounded-top-4">
            <h5 class="mb-0">
                <i class="bi bi-shield-lock"></i> Security Settings
            </h5>
        </div>

        <!-- BODY -->
        <div class="card-body p-4">

            <form method="POST">

                <!-- OLD PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-lock"></i> Old Password
                    </label>
                    <div class="input-group">
                        <input type="password" name="old_password"
                               id="oldPass"
                               class="form-control form-control-lg shadow-sm"
                               placeholder="Enter old password" required>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="togglePassword('oldPass', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- NEW PASSWORD -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-key"></i> New Password
                    </label>
                    <div class="input-group">
                        <input type="password" name="new_password"
                               id="newPass"
                               class="form-control form-control-lg shadow-sm"
                               placeholder="Enter new password" required>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="togglePassword('newPass', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <!-- 🔥 STRENGTH -->
                    <div class="mt-2">
                        <small id="strengthText" class="fw-semibold"></small>
                    </div>
                </div>

                <!-- BUTTON -->
                <div class="d-flex justify-content-between mt-4">

                    <a href="/dashboard" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>

                    <button class="btn btn-warning px-4 shadow">
                        <i class="bi bi-check-circle"></i> Update Password
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- 🔥 SCRIPT -->
<script>

// 👁️ TOGGLE PASSWORD
function togglePassword(id, btn){
    let input = document.getElementById(id);
    let icon = btn.querySelector("i");

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("bi-eye","bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash","bi-eye");
    }
}

// 🔐 PASSWORD STRENGTH
let newPass = document.getElementById("newPass");

if(newPass){
    newPass.addEventListener("input", function(){
        let val = this.value;
        let text = document.getElementById("strengthText");

        if(val.length < 5){
            text.innerHTML = "Weak Password";
            text.style.color = "red";
        } 
        else if(val.length < 8){
            text.innerHTML = "Medium Password";
            text.style.color = "orange";
        } 
        else {
            text.innerHTML = "Strong Password";
            text.style.color = "green";
        }
    });
}

</script>

{% endblock %}
