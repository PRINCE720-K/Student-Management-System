{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <!-- 🔥 HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">
            <i class="bi bi-calendar-check text-primary"></i> Add Attendance
        </h3>
    </div>

    <!-- 🔥 CARD -->
    <div class="card border-0 shadow-lg rounded-4">

        <!-- CARD HEADER -->
        <div class="card-header bg-primary text-white rounded-top-4">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square"></i> Attendance Entry Form
            </h5>
        </div>

        <!-- CARD BODY -->
        <div class="card-body p-4">

            <form method="POST">

                <div class="row g-3">

                    <!-- ROLL -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-hash"></i> Roll No
                        </label>
                        <input type="number" name="roll"
                               class="form-control form-control-lg shadow-sm"
                               placeholder="Enter roll number" required>
                    </div>

                    <!-- CLASS -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-mortarboard"></i> Class
                        </label>
                        <input type="text" name="class"
                               class="form-control form-control-lg shadow-sm"
                               placeholder="Enter class (FYCS / SYCS / TYCS)" required>
                    </div>

                    <!-- MONTH -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-calendar-event"></i> Month
                        </label>
                        <select name="month"
                                class="form-select form-select-lg shadow-sm" required>
                            <option value="">Select Month</option>
                            <option>JAN</option><option>FEB</option><option>MAR</option>
                            <option>APR</option><option>MAY</option><option>JUN</option>
                            <option>JUL</option><option>AUG</option><option>SEP</option>
                            <option>OCT</option><option>NOV</option><option>DEC</option>
                        </select>
                    </div>

                    <!-- ATTENDANCE -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-percent"></i> Attendance %
                        </label>
                        <input type="number" name="attendance" type="number" min="0" max="100"
                               class="form-control form-control-lg shadow-sm"
                               placeholder="Enter attendance %" required>
                    </div>

                </div>

                <!-- BUTTONS -->
                <div class="d-flex justify-content-between mt-4">

                    <a href="/dashboard" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>

                    <button class="btn btn-success px-4 shadow">
                        <i class="bi bi-check-circle"></i> Save Attendance
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
