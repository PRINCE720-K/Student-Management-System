{% extends "base.html" %}
{% block content %}

<style>
.card {
    border-radius: 50px;
}
input, textarea, select {
    border-radius: 15px !important;
}
</style>

<div class="container mt-4">

<div class="card shadow p-4">

<h3 class="text-center mb-4">🎓 Student Admission Form</h3>

<form method="POST" enctype="multipart/form-data">

<div class="row">

<!-- LEFT SIDE -->
<div class="col-md-6">

<label>Roll No</label>
<input type="number" name="roll" class="form-control mb-3" required>

<label>Full Name</label>
<input type="text" name="name" class="form-control mb-3" required>

<label>Father's Name</label>
<input type="text" name="father_name" class="form-control mb-3" placeholder="Father's Name">

<label>Mother's Name</label>
<input type="text" name="mother_name" class="form-control mb-3" placeholder="Mother's Name">

<label>Birth Date</label>
<input type="date" name="birth_date" class="form-control mb-3">

<label>Class</label>
<input type="text" name="class" class="form-control mb-3" required>





</div>

<!-- RIGHT SIDE -->
<div class="col-md-6">

<label>Email</label>
<input type="email" name="email" class="form-control mb-3">

<label>Phone</label>
<input type="text" name="phone" class="form-control mb-3">

<label>Address</label>
<input type="text" name="address" class="form-control mb-3">

<label>Upload Photo</label>
<input type="file   " name="photo" class="form-control mb-3">

<label>Admission Date</label>
<input type="date" name="admission_date" class="form-control mb-3">

<label>Gender</label>
<select name="gender" class="form-control mb-3">
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
</select>

</div>

</div>

<div class="text-center mt-3">
<button class="btn btn-success px-5">💾 Submit Admission</button>
</div>

</form>

</div>

</div>

{% endblock %}
