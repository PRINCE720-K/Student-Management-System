{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<!-- 🔥 HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">
        <i class="bi bi-pencil-square text-warning"></i> Update Marks
    </h2>

    <a href="/marks" class="btn btn-outline-secondary">
        ⬅ Back
    </a>
</div>

<!-- 🔥 CARD -->
<div class="card shadow-lg border-0 rounded-4">

<!-- HEADER -->
<div class="card-header bg-warning text-dark rounded-top-4">
    <h5 class="mb-0">📊 Marks Details</h5>
</div>

<!-- BODY -->
<div class="card-body p-4">

<form method="POST">

    <!-- CURRENT INFO -->
    <div class="alert alert-info mb-4">
        <strong>Current Marks:</strong> {{data[3]}} / {{data[4]}}
    </div>

    <div class="row g-3">

        <!-- MARKS -->
        <div class="col-md-6">
            <label class="form-label fw-semibold">Marks Obtained</label>
            <input type="number"
                   name="marks"
                   id="marksInput"
                   class="form-control form-control-lg shadow-sm"
                   value="{{data[3]}}"
                   required>
        </div>

        <!-- MAX MARKS -->
        <div class="col-md-6">
            <label class="form-label fw-semibold">Max Marks</label>
            <input type="number"
                   name="max_marks"
                   id="maxInput"
                   class="form-control form-control-lg shadow-sm"
                   value="{{data[4]}}"
                   required>
        </div>

    </div>

    <!-- ⚠️ WARNING -->
    <div class="mt-2">
        <small id="warnText" class="text-danger"></small>
    </div>

    <!-- 📊 RESULT PREVIEW -->
    <div class="mt-4">

        <label class="form-label fw-semibold">Result Preview</label>

        <div class="progress" style="height:22px;">
            <div id="progressBar"
                 class="progress-bar bg-success"
                 style="width:0%">
            </div>
        </div>

        <div class="mt-2 fw-bold text-center" id="resultText"></div>

    </div>

    <!-- 🔥 BUTTON -->
    <button class="btn btn-success w-100 mt-4 shadow">
        💾 Update Marks
    </button>

</form>

</div>
</div>

</div>

<!-- 🔥 SCRIPT -->
<script>

let marks = document.getElementById("marksInput");
let max = document.getElementById("maxInput");
let bar = document.getElementById("progressBar");
let warn = document.getElementById("warnText");
let result = document.getElementById("resultText");

// 🎯 LIVE CALCULATION
function updatePreview(){
    let m = parseFloat(marks.value) || 0;
    let mm = parseFloat(max.value) || 1;

    if(m > mm){
        warn.innerText = "Marks cannot be greater than max marks!";
    } else {
        warn.innerText = "";
    }

    let percent = (m/mm)*100;
    percent = percent.toFixed(1);

    bar.style.width = percent + "%";
    bar.innerText = percent + "%";

    // 🎨 COLOR + RESULT
    if(percent < 40){
        bar.className = "progress-bar bg-danger";
        result.innerHTML = "❌ FAIL";
        result.style.color = "red";
    }
    else if(percent < 75){
        bar.className = "progress-bar bg-warning";
        result.innerHTML = "⚠️ AVERAGE";
        result.style.color = "orange";
    }
    else{
        bar.className = "progress-bar bg-success";
        result.innerHTML = "✅ GOOD";
        result.style.color = "green";
    }
}

// INITIAL LOAD
updatePreview();

// INPUT CHANGE
marks.addEventListener("input", updatePreview);
max.addEventListener("input", updatePreview);

</script>

{% endblock %}
