{% extends "base.html" %}
{% block content %}

<div class="container-fluid mt-4">

<!-- 🔥 HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">📚 Manage Subjects</h2>
    <span class="badge bg-primary">{{subjects|length}} Subjects</span>
</div>

<div class="row g-4">

<!-- ➕ ADD SUBJECT -->
<div class="col-lg-4">
<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-success text-white rounded-top-4">
    <h5 class="mb-0">➕ Add New Subject</h5>
</div>

<div class="card-body">

<form method="POST">

    <div class="mb-3">
        <label class="fw-semibold">Subject Name</label>
        <input type="text" name="subject"
               class="form-control form-control-lg shadow-sm"
               placeholder="Enter subject (e.g. Mathematics)" required>
    </div>

    <button class="btn btn-success w-100 shadow">
        ➕ Add Subject
    </button>

</form>

</div>
</div>
</div>

<!-- 📋 SUBJECT LIST -->
<div class="col-lg-8">
<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-dark text-white rounded-top-4 d-flex justify-content-between">
    <h5 class="mb-0">📋 All Subjects</h5>

    <!-- 🔍 SEARCH -->
    <input type="text" id="searchSubject"
           class="form-control w-50"
           placeholder="🔍 Search subject..."
           onkeyup="searchSubject()">
</div>

<div class="card-body p-0">

<div class="table-responsive">

<table class="table table-hover align-middle text-center mb-0">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Subject Name</th>
<th>Action</th>
</tr>
</thead>

<tbody id="subjectTable">

{% for s in subjects %}
<tr>
<td class="fw-bold">{{s[0]}}</td>

<td>
<span class="badge bg-info text-dark px-3 py-2">
{{s[1]}}
</span>
</td>

<td>

<!-- DELETE -->
<a href="/delete_subject/{{s[0]}}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Delete this subject?')">
   🗑
</a>

<!-- OPTIONAL EDIT -->
<button class="btn btn-warning btn-sm"
onclick="openEdit('{{s[0]}}','{{s[1]}}')">
✏️
</button>

</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>
</div>
</div>
</div>

</div>

</div>

<!-- ✏️ EDIT MODAL -->
<div class="modal fade" id="editModal">
<div class="modal-dialog">
<div class="modal-content shadow-lg border-0">

<form method="POST" action="/update_subject">

<div class="modal-header bg-warning">
<h5 class="fw-bold">✏️ Edit Subject</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input type="hidden" name="id" id="sub_id">

<input type="text" name="subject"
       id="sub_name"
       class="form-control form-control-lg"
       required>

</div>

<div class="modal-footer">
<button class="btn btn-success px-4">💾 Update</button>
</div>

</form>

</div>
</div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🔍 SEARCH SUBJECT
function searchSubject(){
    let input = document.getElementById("searchSubject").value.toLowerCase();
    let rows = document.querySelectorAll("#subjectTable tr");

    rows.forEach(row=>{
        let text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
    });
}

// ✏️ EDIT MODAL
function openEdit(id, name){
    document.getElementById("sub_id").value = id;
    document.getElementById("sub_name").value = name;

    new bootstrap.Modal(document.getElementById('editModal')).show();
}

</script>

{% endblock %}
