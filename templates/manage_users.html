{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<!-- 🔥 HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">
        <i class="bi bi-people-fill text-primary"></i> Manage Users
    </h3>

    <a href="/add_user" class="btn btn-success shadow">
        <i class="bi bi-person-plus"></i> Add User
    </a>
</div>

<!-- 🔍 SEARCH -->
<div class="card p-3 shadow-sm mb-3 border-0 rounded-3">
    <input type="text" id="searchInput" class="form-control"
           placeholder="🔍 Search user by username...">
</div>

<!-- 📋 TABLE -->
<div class="card shadow-lg border-0 rounded-4 p-3">

    {% if users %}

    <div class="table-responsive">
    <table class="table table-hover align-middle text-center" id="userTable">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
        {% for u in users %}
        <tr>

            <td><b>{{u[0]}}</b></td>

            <td>{{u[1]}}</td>

            <td>
                {% if u[2] == "admin" %}
                    <span class="badge bg-danger">
                        👑 Admin
                    </span>
                {% else %}
                    <span class="badge bg-secondary">
                        👤 User
                    </span>
                {% endif %}
            </td>

            <td>

                <!-- 🔑 PASSWORD -->
                <a href="/change_password_user/{{u[0]}}"
                   class="btn btn-warning btn-sm shadow">
                   <i class="bi bi-key"></i>
                </a>

                <!-- 🗑 DELETE -->
                <a href="/delete_user/{{u[0]}}"
                   class="btn btn-danger btn-sm shadow"
                   onclick="return confirm('Delete this user?')">
                   <i class="bi bi-trash"></i>
                </a>

            </td>

        </tr>
        {% endfor %}
        </tbody>

    </table>
    </div>

    {% else %}

    <!-- ❌ EMPTY -->
    <div class="text-center py-5">
        <i class="bi bi-person-x display-4 text-muted"></i>
        <h5 class="mt-3 text-danger">No Users Found</h5>
    </div>

    {% endif %}

</div>

</div>

<!-- 🔥 SCRIPT -->
<script>

// 🔍 SEARCH FILTER
document.getElementById("searchInput").addEventListener("keyup", function(){
    let value = this.value.toLowerCase();
    let rows = document.querySelectorAll("#userTable tbody tr");

    rows.forEach(row => {
        let username = row.children[1].innerText.toLowerCase();
        row.style.display = username.includes(value) ? "" : "none";
    });
});

</script>

<!-- 🔥 STYLE -->
<style>

.card{
    transition:0.3s;
}
.card:hover{
    transform:translateY(-3px);
}

.table-hover tbody tr:hover{
    background:#f1f5ff;
}

</style>

{% endblock %}
